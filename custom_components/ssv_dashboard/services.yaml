save_scene:
  fields:
    name:
      required: true
      example: "Movie night"
      selector:
        text:
    entities:
      required: true
      example: '{"light.living_ceiling": {"state": "on", "brightness": 80}}'
      selector:
        object:
    icon:
      example: "mdi:movie"
      selector:
        icon:
    scene:
      example: "scene.movie_night"
      selector:
        entity:
          domain: scene
    timing:
      example: '{"light.living_ceiling": {"delay": 0, "back": 30, "back_to": "off"}}'
      selector:
        object:
    panels:
      example: '["living", "master"]'
      selector:
        object:
    home:
      selector:
        boolean:
get_scene:
  fields:
    scene:
      required: true
      selector:
        entity:
          domain: scene
delete_scene:
  fields:
    scene:
      required: true
      selector:
        entity:
          domain: scene
run_scene:
  fields:
    entity_id:
      required: true
      example: "scene.movie_night"
      selector:
        entity:
          domain: scene
