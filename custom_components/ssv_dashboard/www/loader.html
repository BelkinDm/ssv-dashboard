<!DOCTYPE html>
<!-- SSV Dashboard loader. Copied by the integration to /config/www/ssv/loader.html and served by Home Assistant
     itself at /local/ssv/loader.html, so it answers even while Home Assistant is still starting and SSV Dashboard
     is not loaded yet (that is when a panel used to get the plain "404: Not Found" and stay on it).
     The dashboards open it as  /local/ssv/loader.html?to=/ssv_dashboard/room.html%3Fpanel%3D<id>
     It waits until the SSV page answers 200 and only then opens it. Build __SSV_VERSION__ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSV Dashboard</title>
<style>
html,body{margin:0;height:100%;background:#070B10;color:#8C9AA8;font:500 14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
.d{width:10px;height:10px;border-radius:50%;background:#E5B567;animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
b{color:#E8EDF2;font-weight:500;font-size:18px;letter-spacing:.02em}
small{font:12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:#56636F}
</style></head>
<body><div class="c"><div class="d"></div><b id="t">Reconnecting…</b><small id="s">Waiting for Home Assistant</small></div>
<script>
(() => {
  const to = new URLSearchParams(location.search).get('to') || '';
  const ok = /^\/ssv_dashboard\/[a-z]+\.html(\?|$)/.test(to);
  if (!ok) { document.getElementById('t').textContent = 'Wrong panel address'; document.getElementById('s').textContent = to || 'no ?to='; return; }
  let n = 0;
  const go = async () => {
    n++;
    try { const r = await fetch(to, { cache: 'no-store' }); if (r.ok) { location.replace(to); return; } } catch (e) {}
    document.getElementById('s').textContent = n > 2 ? 'Home Assistant is starting · try ' + n : 'Waiting for Home Assistant';
    setTimeout(go, Math.min(2000 * n, 10000));
  };
  go();
})();
</script></body></html>
