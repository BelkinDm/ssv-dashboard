<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INEX Room Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B10;--surface:#0F1720;--raised:#121C26;--line:#1E2A36;--line2:#26333F;--text:#E6EDF3;--text2:#93A3B3;--text3:#7B8B9B;
--mint:#8FD9B6;--amber:#E2B66E;--heat:#E88E7E;--cool:#8CC0E8;--alert:#E0695A;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:Manrope,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:480px;height:480px;display:flex;flex-direction:column;transform-origin:center}
header{height:66px;flex:none;display:flex;align-items:center;gap:12px;margin:8px 10px 0;padding:0 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
#logo{width:28px;flex:none;display:flex}
.hb{display:flex;flex-direction:column;gap:5px;min-width:0}
.hb.room{flex:1}
.hsep{width:1px;align-self:stretch;margin:14px 0;background:var(--line2);flex:none}
.hl{font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;max-width:120px}
.hl span{overflow:hidden;text-overflow:ellipsis}
.hv{font:300 26px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hv span{font:400 13px var(--sans);color:var(--text2);margin-left:7px;letter-spacing:0}
.card .row.hd{height:30px;flex:none}
#clock{font:600 20px var(--mono);letter-spacing:.04em}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px}
.row.eq>.btn,.row.eq>.pill{flex:1 1 0;min-width:0;padding:0 6px}
.row.eq{gap:8px}
.card{gap:8px}
/* Home: everything fits one 480 px screen — same 8 px gap between all buttons and cards */
#view.home .card{padding:10px 12px;gap:8px}
#view.home .btn{height:40px;min-width:40px}
#view.home .btn.sq{width:40px}
#view.home .spv{font-size:22px;min-width:64px}
#view.home .pill{height:50px;gap:8px;padding:0 8px}
#view.home .pill .ico{width:30px;height:30px;border-radius:8px}
.pill .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view.home .row.n4 .pill .ico{display:none}
#view.home .row.n4 .pill{padding:0 10px}
.pill>span:last-child{min-width:0;overflow:hidden}
nav{height:64px;flex:none;border-top:1px solid var(--line);display:flex;gap:6px;padding:4px 8px}
nav button{flex:1;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text2);font:500 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid transparent}
nav button.on{background:#12302A;border-color:#2A5A4A;color:var(--mint)}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.card.heat{background:#241416;border-color:#5E3330}
.card.cool{background:#0E1C2A;border-color:#2B4A66}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.lab{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
.lab.heat{color:var(--heat)}.lab.cool{color:var(--cool)}.lab.amber{color:var(--amber)}.lab.mint{color:var(--mint)}
.nm{font:500 16px var(--sans)}
.btn{height:48px;min-width:48px;border-radius:12px;background:var(--raised);border:1px solid var(--line2);font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;flex:1}
.btn.sel{background:var(--mint);border-color:var(--mint);color:#0A2018}
.btn.sq{flex:none;width:48px;padding:0}
.btn.dim{opacity:.45}
.btn .t{text-transform:none}
.big{font:200 64px/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big small,.mid small{font-size:.38em;color:var(--text2);letter-spacing:0;margin-left:2px;font-weight:300}
.mid{font:300 34px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.spv{font:300 26px var(--sans);min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.pill{flex:1;height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left}
.pill.on{background:#2A2216;border-color:#4A3B22}
.ico{width:36px;height:36px;border-radius:10px;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--text2);flex:none}
.on .ico{background:var(--amber);color:#2A1E08}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;overflow:hidden;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;touch-action:none}
.tile.on{border-color:#4A3B22}
.tile .fill{position:absolute;left:0;right:0;bottom:0;background:#3A2E1A;pointer-events:none}
.tile>*{position:relative}
.tile .v{font:300 27px var(--sans);line-height:1}
.tile .n{font:600 14.5px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sd{font:500 7.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-top:4px;white-space:nowrap}
.tile.on .sd{color:#C9B48C}
.tile .z{font:500 8px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.tile.on .z{color:var(--amber)}
.tile.alloff{background:var(--amber);border-color:var(--amber);color:#2A1E08;align-items:center;justify-content:center;gap:8px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.tile.alloff.none{background:var(--surface);border-color:var(--line);color:var(--text3)}
.win{position:relative;flex:1;min-height:0;border-radius:10px;background:#16222E;border:1px solid var(--line2);overflow:hidden;touch-action:none}
.win .f{position:absolute;top:0;bottom:0;background:#4A4136}
.win.net .f{background:#3C4A58}.win.blackout .f{background:#2A2620}
.win .f.l{left:0;border-right:2px solid #625645}.win .f.r{right:0;border-left:2px solid #625645}
.win .h{position:absolute;top:42%;width:6px;height:28px;border-radius:3px;background:#E6EDF3}
/* INEX 2026-10-27: curtain types, handles, light knob */
.cw{position:relative;border-radius:10px;background:#142231;overflow:hidden;border:1px solid var(--line);touch-action:none;flex:1;min-height:0;--m:14px;--g:6px}.cw i{position:absolute;display:block;pointer-events:none}.cw.both::before{content:"";position:absolute;left:50%;top:10px;bottom:0;width:1px;background:#22344A}.cw .rl{left:0;right:0;top:0;height:5px;background:#2A3744;z-index:1}.cw .pn{top:5px;bottom:0;background-color:#4A4136;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,transparent 2px 10px)}.cw.net .pn{background-color:#3C4A58}.cw.blackout .pn{background-color:#2A2620}.cw .pn.a{left:0;border-right:2px solid #625645}.cw .pn.b{right:0;border-left:2px solid #625645}.cw.net .pn.a,.cw.net .pn.b{border-color:#56677A}.cw.both .pn{width:calc(var(--m) + (50% - var(--m) - var(--g)) * (1 - var(--p)))}.cw.left .pn,.cw.right .pn{width:calc(var(--m) + (100% - 2 * var(--m)) * (1 - var(--p)))}.cw .hk{top:calc(50% + 2px);width:8px;height:30px;margin:-15px 0 0 -4px;border-radius:5px;background:#E6EDF3;border:2px solid #0F1720;box-sizing:border-box;box-shadow:0 0 0 4px rgba(230,237,243,.12);z-index:2}.cw.both .hk.a{left:calc(var(--m) + (50% - var(--m) - var(--g)) * (1 - var(--p)))}.cw.both .hk.b{left:calc(100% - var(--m) - (50% - var(--m) - var(--g)) * (1 - var(--p)))}.cw.left .hk.a{left:calc(var(--m) + (100% - 2 * var(--m)) * (1 - var(--p)))}.cw.right .hk.b{left:calc(100% - var(--m) - (100% - 2 * var(--m)) * (1 - var(--p)))}.cw.roller .pn,.cw.shutter .pn{left:0;right:0;bottom:auto;height:calc(var(--m) + (100% - 5px - 2 * var(--m)) * (1 - var(--p)));background-image:none;border-bottom:4px solid #625645;box-sizing:border-box}.cw.shutter .pn{background:repeating-linear-gradient(180deg,#5B6875 0 8px,#3F4A55 8px 10px);border-bottom-color:#8A98A6}.cw.roller .hk,.cw.shutter .hk{left:50%;width:30px;height:8px;margin:-4px 0 0 -15px;top:calc(5px + var(--m) + (100% - 5px - 2 * var(--m)) * (1 - var(--p)))}.cw.mv .hk{background:#E2B66E}.tile{--in:8px}.tile .fill.pv{height:calc(var(--in) + (100% - 2 * var(--in)) * var(--p,0))}.tile:not(.on) .fill.pv{height:0}.tile .kn{position:absolute;right:9px;bottom:calc(var(--in) + (100% - 2 * var(--in)) * var(--p,0));width:20px;height:5px;margin-bottom:-2.5px;border-radius:3px;background:#3A4856;box-shadow:0 0 0 3px rgba(7,11,16,.35);pointer-events:none}.tile.on .kn{background:#E6EDF3}.tile:not(.on) .fill.pv{height:calc(var(--in) + (100% - 2 * var(--in)) * var(--p,0));background:transparent}.tile .fill.pv::before{content:"";position:absolute;left:8px;right:8px;top:-.5px;height:1px;background:rgba(147,163,179,.35)}.tile.on .fill.pv::before{background:rgba(243,221,174,.6)}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;text-align:center}
#night{position:fixed;inset:0;background:#000;display:none;z-index:9}
#night.show{display:block}
#night .in{position:absolute;left:50%;top:50%;width:480px;height:480px;transform-origin:center;padding:22px;display:flex;flex-direction:column;opacity:.45}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;display:none;z-index:10}
#toast.show{display:block}
</style>
</head>
<body>
<div id="stage"><header><div id="logo"></div><div class="hb room" id="hroom"></div><div class="hsep"></div><div class="hb" id="hout"></div><div class="hsep"></div><div id="clock">--:--</div></header><main id="view"></main><nav id="nav"></nav></div>
<div id="night"><div class="in" id="nightIn"></div></div>
<div id="toast"></div>
<script>
/* INEX room panel 4" (480 x 480) — brand book v1.2. Own WebSocket connection to Home Assistant (uses this panel's login), single consolidated file.
   URL: /ssv_dashboard/room.html?panel=<id> — the panel is made on the SSV Dashboard page.
   Labels (made by SSV when the panel is saved; Settings → Labels shows the names):
     Panel <Name>         (id panel_<id>)        on the room's area: the whole room; on a device: just that device
     Panel <Name> WC      (id panel_<id>_wc)     the WC tab — every room panel has it
     Panel <Name> <Room>  (id panel_<id>_<key>)  the tab of another attached room (Shower, Balcony…)
   A device in the panel's area, or in the area of an attached room, is on the panel without any label. */
const IC = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  rooms:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  cove:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.2"/><circle cx="12" cy="7.5" r="1.2"/><circle cx="16" cy="10" r="1.2"/>',
  pendant:'<path d="M12 3v5"/><path d="M5 15a7 7 0 0 1 14 0z"/><path d="M10 18h4"/>',
  spot:'<circle cx="7" cy="8" r="2"/><circle cx="17" cy="8" r="2"/><path d="M3 21h18M7 10v11M17 10v11"/>',
  stairs:'<path d="M3 20h5v-5h5v-5h5V5h3"/>',
  vanity:'<rect x="5" y="3" width="14" height="12" rx="2"/><path d="M8 19h8M12 15v4"/>',
  climate:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 11v6"/>',
  curtains:'<path d="M3 4h18"/><path d="M5 4c0 6 1.5 12 4 16H5zM19 4c0 6-1.5 12-4 16h4z"/>',
  water:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9 14a3 3 0 0 0 3 3"/>',
  camera:'<rect x="3" y="6.5" width="12.5" height="11" rx="2"/><path d="M15.5 10.5l5.5-3v9l-5.5-3"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
  door:'<path d="M6 21V4h10v17M4 21h16"/><circle cx="13" cy="12.5" r=".8"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  power:'<path d="M12 3v9"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/>',
  minus:'<path d="M6 12h12"/>', plus:'<path d="M6 12h12M12 6v12"/>',
  snow:'<path d="M12 2v20M4 6l16 12M20 6L4 18"/>',
  waves:'<path d="M3 20h18"/><path d="M6 16c0-2 2-2 2-4s-2-2-2-4M12 16c0-2 2-2 2-4s-2-2-2-4M18 16c0-2 2-2 2-4s-2-2-2-4"/>',
  flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1.5 1 2 2 2 3 0-3 1-5 1-7z"/>',
  pump:'<circle cx="12" cy="12" r="8"/><path d="M8 12a4 4 0 0 1 7-2.6M16 12a4 4 0 0 1-7 2.6"/><path d="M15 6.5v3h-3M9 17.5v-3h3"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M10 2h4"/>',
  play:'<path d="M7 5l12 7-12 7z"/>',
  open:'<path d="M9 12H3M6 9l-3 3 3 3M15 12h6M18 9l3 3-3 3"/>',
  close:'<path d="M3 12h6M6 9l3 3-3 3M21 12h-6M18 9l-3 3 3 3"/>',
  stop:'<rect x="7" y="7" width="10" height="10" rx="1.5"/>',
  c_left:'<path d="M3 4h18"/><path d="M5 4c0 6 2.5 12 6 16H5z"/><path d="M19 4v16"/>',
  c_right:'<path d="M3 4h18"/><path d="M19 4c0 6-2.5 12-6 16h6z"/><path d="M5 4v16"/>',
  c_roller:'<rect x="3" y="3" width="18" height="3" rx="1.5"/><path d="M5 6v10h14V6"/><path d="M12 16v3"/><circle cx="12" cy="20" r="1"/>',
  c_shutter:'<rect x="3" y="3" width="18" height="4" rx="1"/><path d="M5 7v13h14V7"/><path d="M5 11h14M5 15h14"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>', down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  aleft:'<path d="M20 12H4M10 6l-6 6 6 6"/>', aright:'<path d="M4 12h16M14 6l6 6-6 6"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/>',
  warn:'<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17v.5"/>',
  arc:'<circle cx="12" cy="12" r="9" stroke-opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  chev:'<path d="M9 6l6 6-6 6"/>', chevl:'<path d="M15 6l-6 6 6 6"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  scene:'<path d="M12 3l2.2 5.3 5.8.5-4.4 3.8 1.3 5.6L12 15.3 7.1 18.2l1.3-5.6L4 8.8l5.8-.5z"/>',
  full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  cloud:'<circle cx="9" cy="8" r="3"/><path d="M9 2.5v1M3.5 8h1M5 4l.7.7M13 4l-.7.7"/><path d="M8 19h9a3.5 3.5 0 0 0 0-7 4.5 4.5 0 0 0-8.4 1.6A2.7 2.7 0 0 0 8 19z"/>',
};
const LOGO = (s=44) => `<svg viewBox="30 26.6 200.4 200.4" role="img" aria-label="INEX" style="width:${s}px;height:${s}px;flex:none"><path fill="#FFFFFF" d="M 39.67 217.17 L 39.67 145.96 L 31.96 145.96 L 31.96 224.88 L 110.87 224.88 L 110.87 217.17 Z M 91.23 71.12 L 91.23 63.39 L 69.90 63.39 L 69.90 71.12 L 76.71 71.12 L 76.71 99.59 L 69.90 99.59 L 69.90 107.31 L 91.23 107.31 L 91.23 99.59 L 84.43 99.59 L 84.43 71.12 Z M 31.96 28.39 L 31.96 107.31 L 39.67 107.31 L 39.67 36.11 L 110.87 36.11 L 110.87 28.39 Z M 220.72 145.96 L 220.72 217.17 L 149.52 217.17 L 149.52 224.88 L 228.44 224.88 L 228.44 145.96 Z M 180.62 166.53 L 193.14 149.08 L 193.14 145.96 L 185.86 145.96 L 175.85 159.91 L 165.85 145.96 L 158.58 145.96 L 158.58 149.08 L 171.11 166.53 L 156.56 186.79 L 156.56 189.90 L 163.85 189.90 L 175.86 173.16 L 187.87 189.90 L 195.15 189.90 L 195.15 186.79 Z M 149.52 28.39 L 149.52 36.10 L 220.72 36.10 L 220.72 107.31 L 228.44 107.31 L 228.44 28.39 Z M 186.04 63.37 L 186.04 91.16 L 161.87 63.37 L 157.96 63.37 L 157.96 107.31 L 165.67 107.31 L 165.67 79.53 L 189.85 107.31 L 193.75 107.31 L 193.75 63.37 Z M 94.17 153.67 L 94.17 145.96 L 68.34 145.96 L 66.63 145.99 L 66.63 189.89 L 94.17 189.89 L 94.17 182.14 L 74.33 182.14 L 74.33 171.33 L 92.97 171.33 L 92.97 163.62 L 74.33 163.62 L 74.33 153.67 Z"/></svg>`;
const Q = new URLSearchParams(location.search);
/* ?panel=<id> of a panel made on the SSV Dashboard page brings its room(s), attached rooms, night hours and run times.
   Old addresses (?room=<label>&panel=panel_<id>) keep working. */
let ROOM = Q.get('room') || '';
let PANEL = Q.get('panel') || ('panel_' + ROOM);
let NIGHT_FROM = +(Q.get('night_from') || 22), NIGHT_TO = +(Q.get('night_to') || 7), NIGHT_ON = true; const IDLE = 60;
let WALL_RUN = 180, RUNS = {}, ATT = []; const WATER_RUNS = [60, 90, 120], REC_RUN = 10;
let CFG = null, CFG_AREAS = [];
/* run buttons chosen on the SSV Dashboard page: key (entity id or fn:<function>) -> minutes */
const runsOf = (key, def) => { const r = RUNS[key]; return Array.isArray(r) && r.length ? r.slice(0, 3) : (typeof r === 'number' ? [r] : def); };
const wallRunOf = (id) => Math.max(...runsOf(id, [WALL_RUN]));
function applyCfg(c){
  if (!c) return; CFG = c;
  CFG_AREAS = c.areas || [];
  if (!Q.get('room') && (c.room || CFG_AREAS[0])) ROOM = c.room || CFG_AREAS[0];
  PANEL = 'panel_' + c.id;
  const n = c.night || {}; if (n.enabled === false) NIGHT_ON = false;
  if (n.from != null && !Q.get('night_from')) NIGHT_FROM = +n.from; if (n.to != null && !Q.get('night_to')) NIGHT_TO = +n.to;
  if (c.runs) { RUNS = c.runs; if (c.runs.wall) WALL_RUN = +c.runs.wall; if (c.runs.per) Object.assign(RUNS, c.runs.per); }

  M = safe(model, M); if (!M) return; safe(renderHead); const T = safe(tabs, [['home', 'Home', 'home']]); if (!T.some(t => t[0] === view)) view = 'home';
  $('nav').innerHTML = T.map(([k, n, ic]) => `<button class="${k === view ? 'on' : ''}" data-tab="${k}">${svg(ic)}<span>${n}</span></button>`).join('');
  $('view').classList.toggle('home', view === 'home');

function tick(){

    const night = M && nightNow(); if (!!night !== $('night').classList.contains('show')) render(); else if (night && d.getSeconds() === 0) renderNight();

function fit(){ const k = Math.min(innerWidth, innerHeight) / 480; $('stage').style.transform = `translate(-50%,-50%) scale(${k})`; $('nightIn').style.transform = `translate(-50%,-50%) scale(${k})`; }

/* ---------- actions ---------- */
let toastT = 0;
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2500); }
const tmpQ = {};
function stepTemp(id, d){ const cur = tmpQ[id] != null ? tmpQ[id].v : +attr(id, 'temperature') || 22; const v = Math.round((cur + d) * 2) / 2;
  clearTimeout(tmpQ[id] && tmpQ[id].t); tmpQ[id] = { v, t: setTimeout(() => { call('climate', 'set_temperature', { entity_id: id, temperature: v }); delete tmpQ[id]; }, 600) };
  document.querySelectorAll(`[data-tmp="${id}"]`).forEach(b => { const sp = b.parentElement.querySelector('.spv'); if (sp) sp.textContent = fmtT(v) + '°'; }); }
async function ensureTimer(tid, labels, dur){

  try { await HA().callWS({ type: 'timer/create', name: tid.split('.')[1], duration: dur, restore: true });
    await HA().callWS({ type: 'config/entity_registry/update', entity_id: tid, labels }).catch(() => {}); return tid; }
  catch (e) { toast('Run timer missing'); return null; }
}
async function wallAct(a, id, min){
  const tid = wallTimerId(id); const t = st(tid);
  if (a === 'run') { call('climate', 'set_hvac_mode', { entity_id: id, hvac_mode: 'heat' }); const ok = await ensureTimer(tid, lbl(id).filter(l => l !== 'home'), durStr(min || wallRunOf(id))); if (ok) { call('timer', 'start', { entity_id: tid, duration: durStr(min || wallRunOf(id)) }); toast('Heated wall · ' + fmtMin(min || wallRunOf(id))); } return; }

}
function devs(fn){ return (fn === 'hot_water' ? M.hot : M.rec).filter(id => ['switch', 'fan', 'water_heater', 'input_boolean'].includes(dmn(id))); }
function devSet(ids, on){ ids.forEach(id => dmn(id) === 'water_heater' ? call('water_heater', on ? 'turn_on' : 'turn_off', { entity_id: id }) : call('homeassistant', on ? 'turn_on' : 'turn_off', { entity_id: id })); }

  if (tid) { call('timer', 'start', { entity_id: tid, duration: durStr(min) }); toast((fn === 'hot_water' ? 'Hot water' : 'Recirculation') + ' · ' + fmtMin(min)); }
}
function waterOff(fn){ const tid = timerOf(['water', fn]); if (tid && st(tid).state !== 'idle') call('timer', 'cancel', { entity_id: tid }); devSet(devs(fn), false); }
function toggleLight(id){ call(dmn(id) === 'light' ? 'light' : 'homeassistant', 'toggle', { entity_id: id }); }

document.addEventListener('pointerdown', () => { const wasNight = $('night').classList.contains('show'); lastTouch = Date.now();
  if (wasNight) { forceAwake = Date.now() + IDLE * 1000; } }, true);
document.addEventListener('click', (e) => {
  if ($('night').classList.contains('show')) { const b = e.target.closest('button');
    if (b && b.dataset.alloff) call('homeassistant', 'turn_off', { entity_id: M.lights });
    else if (b && b.dataset.cvall) call('cover', 'close_cover', { entity_id: M.covers });
    else { $('night').classList.remove('show'); }
    return; }
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.tab) { view = d.tab; render(); return; }
  if (d.light) { if (suppress) return; toggleLight(d.light); return; }
  if (d.alloff) { call('homeassistant', 'turn_off', { entity_id: M.lights.filter(isOn) }); return; }
  if (d.lpage) { lpage++; render(); return; }
  if (d.grp) { const ids = d.grp.split(','); const any = ids.some(isOn); call('homeassistant', any ? 'turn_off' : 'turn_on', { entity_id: ids }); return; }
  if (d.tmp) { stepTemp(d.tmp, +d.d); return; }
  if (d.relay) { const on = !!d.on; call('homeassistant', on ? 'turn_on' : 'turn_off', { entity_id: d.relay });
    const tid = 'timer.inex_ufh_' + d.relay.split('.')[1]; if (!on && tState(tid).on) call('timer', 'cancel', { entity_id: tid }); return; }
  if (d.mode) { call('climate', 'set_hvac_mode', { entity_id: d.mode, hvac_mode: d.m }); return; }

  if (d.fan) { call('climate', 'set_fan_mode', { entity_id: d.fan, fan_mode: d.f }); return; }
  if (d.scene) { if (dmn(d.scene) === 'script') call('script', 'turn_on', { entity_id: d.scene }); else call('ssv_dashboard', 'run_scene', { entity_id: d.scene }); toast(NM(d.scene)); return; }
  if (d.urun) { const id = d.urun, tid = 'timer.inex_ufh_' + id.split('.')[1]; if (dmn(id) === 'climate') call('climate', 'set_hvac_mode', { entity_id: id, hvac_mode: 'heat' }); else call('homeassistant', 'turn_on', { entity_id: id });
    if (st(tid)) { call('timer', 'start', { entity_id: tid, duration: durStr(+d.min) }); toast('Floor heating · ' + fmtMin(+d.min)); } return; }
  if (d.wrun) { waterRun(d.wrun, +d.min); return; }

});
/* light tile: vertical drag = brightness; curtain window: horizontal drag = position */
let suppress = false;
document.addEventListener('pointerdown', (e) => {
  const tile = e.target.closest('.tile[data-dim="1"]'); const win = e.target.closest('.cw[data-cover]');
  if (!tile && !win) return; suppress = false;
  dragging = { el: tile || win, x: e.clientX, y: e.clientY, moved: false, v: null };
});
document.addEventListener('pointermove', (e) => { if (!dragging) return; const g = dragging; const r = g.el.getBoundingClientRect();
  if (!g.moved && Math.abs(e.clientY - g.y) < 8 && Math.abs(e.clientX - g.x) < 8) return; g.moved = true; suppress = true;
  if (g.el.classList.contains('tile')) { const ins = 8 * (r.height / (g.el.offsetHeight || r.height)); g.v = Math.max(1, Math.min(100, Math.round((r.bottom - ins - e.clientY) / (r.height - 2 * ins) * 100)));
    g.el.style.setProperty('--p', g.v / 100); g.el.querySelector('.v').textContent = g.v + '%'; g.el.classList.add('on'); }
  else { const k = g.el.dataset.k, sc = r.width / (g.el.offsetWidth || r.width), m = 14 * sc, gp = 6 * sc; let c;
    if (k === 'both') { const half = r.width / 2; c = (half - Math.abs(e.clientX - (r.left + half)) - m) / (half - m - gp); }
    else if (k === 'left') c = (e.clientX - r.left - m) / (r.width - 2 * m);
    else if (k === 'right') c = (r.right - e.clientX - m) / (r.width - 2 * m);
    else { const tp = 5 * sc; c = (e.clientY - r.top - tp - m) / (r.height - tp - 2 * m); }
    g.v = Math.max(0, Math.min(100, Math.round(100 * (1 - c)))); g.el.style.setProperty('--p', g.v / 100);

});
document.addEventListener('pointerup', () => { const g = dragging; dragging = null; if (!g) return;
  if (g.moved && g.v != null) { if (g.el.classList.contains('tile')) call('light', 'turn_on', { entity_id: g.el.dataset.light, brightness_pct: g.v });

  if (g.moved && g.v != null) OPT[g.el.classList.contains('tile') ? g.el.dataset.light : g.el.dataset.cover] = { v: g.v, light: g.el.classList.contains('tile'), t0: Date.now() };
  setTimeout(() => { suppress = false; schedule(); }, 50); });

/* ---------- start ---------- */

  addEventListener('resize', fit); fit(); render(); tick(); setInterval(tick, 1000);
  setInterval(() => document.querySelectorAll('[data-left]').forEach(el => { const ts = tState(el.dataset.left); if (ts.on && ts.left != null) { const v = hms(ts.left); if (el.textContent !== v) el.textContent = v; } }), 250);

function wallCard(id){

/* Light order (same rule on every panel): own room first -> balcony -> WC; inside a zone: main -> cove/vanity -> other */

  $('hout').innerHTML = w ? `<div class="hl">${svg('cloud', 'width:12px;height:12px')}<span>${esc(st(w).state.replace(/[-_]/g, ' '))}</span></div><div class="hv">${Math.round(attr(w, 'temperature'))}°${fc ? `<span>${Math.round(fc.temperature)}° / ${Math.round(fc.templow)}°</span>` : ''}</div>` : '';

/* Light order on every panel: Chandelier - Spots - Track - Cove - Vanity - Hanging/Pendant - Floor lamp - Mirror - Balcony - Wardrobe - other */
function lightOrder(id){
  const n = ' ' + String(attr(id, 'friendly_name') || id.split('.')[1]).replace(/^(LED\s+)?[A-Z]{1,3}\d+(\.\d+)*\s+/i, '').toLowerCase().replace(/[_\-.]/g, ' ') + ' ';
  const ORD = [
    [/\bwardrobe\b/, 9], [/\b(balcony|terrace)\b/, 8],
    [/\bchandelier\b/, 0], [/\b(spot|spots|spotlight|spotlights|downlight|downlights)\b/, 1], [/\btrack\b/, 2],
    [/\bcove\b/, 3], [/\bvanity\b/, 4], [/\b(hanging|pendant)\b/, 5], [/\bfloor lamp\b|\bstanding lamp\b/, 6], [/\bmirror\b/, 7],
  ];
  for (const [re, r] of ORD) if (re.test(n)) return r;

}
