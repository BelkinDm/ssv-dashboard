<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SSV Dashboard · Wall Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Villa Wall Panel · design system v1.0 tokens ===== */
:root{
  --bg:#070B10;--side:#0B121A;--surface:#0F1720;--raised:#121C26;--line:#1E2A36;--line2:#26333F;
  --text:#E6EDF3;--text2:#93A3B3;--text3:#7B8B9B;--soft:#B4C1CD;
  --mint:#8FD9B6;--amber:#E2B66E;--heat:#E88E7E;--cool:#8CC0E8;--alert:#E0695A;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;background:var(--bg);font-family:var(--sans);color:var(--text);overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
#side{position:absolute;left:0;top:0;width:200px;height:800px;padding:16px 12px;background:var(--side);border-right:1px solid #1A2530;display:flex;flex-direction:column;gap:6px}
.brand{height:72px;padding:0 6px;display:flex;align-items:center;gap:14px;margin-bottom:8px}
.brand .nm{display:flex;flex-direction:column;gap:4px;min-width:0;padding-left:14px;border-left:1px solid var(--line)}
.brand .nm b{font-size:20px;font-weight:300;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .nm span{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab{height:auto;min-height:44px;flex:0 1 58px;border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:14px;background:transparent;color:var(--soft);border:1px solid transparent;width:100%;text-align:left}
.tab span{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tab.sel{background:#12302A;color:var(--mint);border-color:#2A5A4A}
.tab.night{color:var(--text3)}
#top{position:absolute;left:216px;top:16px;width:1048px;height:72px;padding:0 12px 0 24px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;gap:16px}
#top .ttl{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
#top .eb{font:500 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--cool);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .hd{font-size:28px;font-weight:400;letter-spacing:-.01em;line-height:1.1}
.pill{height:56px;border-radius:14px;padding:0 16px;background:var(--raised);border:1px solid var(--line2);display:flex;align-items:center;gap:12px}
.pill .v{font-size:24px;font-weight:300;letter-spacing:-.02em}
.pill .l{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text2);line-height:1.35}
.pill.warn{background:#2E2614;border-color:#5A4826;color:#E8C487;font:600 15px var(--mono);letter-spacing:.1em}
.pill.crit{background:#3A1C1A;border-color:#6A302A;color:#F0AFA3;font:600 15px var(--mono);letter-spacing:.1em}
.clk{display:flex;flex-direction:column;align-items:flex-end;padding:0 8px 0 4px}
.clk b{font:500 30px var(--mono);color:#CFE6F7;letter-spacing:.04em;line-height:1.1}
.clk span{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
#view{position:absolute;left:216px;top:104px;width:1048px;height:680px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;color:var(--text);min-width:0;min-height:0;position:relative;text-align:left}
.card.on{background:#1C1810;border-color:#4E3F22}
.card.heat{background:#241416;border-color:#5E3330}
.card.cool{background:#0E1C2A;border-color:#2B4A66}
.card.ok{background:#0E1C18;border-color:#2A4A3D}
.card.na,.tile.na{background:#0A1016;border:1px dashed #2E3B48}
.row{display:flex;align-items:center;gap:14px;min-width:0}
.col{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.e{font:500 13px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e.w{color:var(--text);font-size:14px}
.s{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s.amber{color:#C9B48C}.s.heat{color:var(--heat)}.s.cool{color:var(--cool)}.s.mint{color:var(--mint)}.s.dim{color:var(--text3)}
.t{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n{font-size:22px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font-size:48px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.u{font-size:.4em;font-weight:400;color:var(--text2);margin-left:3px;letter-spacing:0}
.big{font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
.hr{height:1px;background:#1A2530;flex:none}
.sp{flex:1}
.btn{height:56px;min-width:56px;border-radius:14px;background:var(--raised);border:1px solid var(--line2);color:var(--text);font:500 14px var(--mono);letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;flex:1;white-space:nowrap}
.btn.sel{background:var(--mint);border-color:var(--mint);color:#0A2018}
.btn.lit{background:var(--amber);border-color:var(--amber);color:#2A1E0A}
.btn.sq{flex:none;width:56px;padding:0}
.btn.f{flex:none;padding:0 20px}
/* floor buttons: one fixed size on every page, with or without the light counter */
.btn.fl{flex:none;width:156px;padding:0 10px;justify-content:center;overflow:hidden}.btn.fl>.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.btn.dim{color:#5E6E7E;border-color:#1A242E}
.btn.ghost{background:rgba(7,11,16,.45);border-color:#3A3F46}
.btn.danger{background:var(--alert);border-color:var(--alert);color:#1A0806}
.btn:disabled{opacity:.35}
.chip{height:30px;border-radius:15px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;background:#16212C;color:var(--text2);white-space:nowrap;flex:none}
.chip.amber{background:#2E2614;color:#E8C487}.chip.mint{background:#12302A;color:#A6E4C6}.chip.cool{background:#13283A;color:#A9CDEB}.chip.heat{background:#3A1C1A;color:#F0AFA3}.chip.crit{background:var(--alert);color:#1A0806}
.dot{width:8px;height:8px;border-radius:4px;background:currentColor;flex:none;display:inline-block}
.fchip{height:56px;border-radius:14px;background:transparent;border:1px solid var(--line);color:var(--soft);font:600 15px var(--sans);padding:0 18px;display:inline-flex;align-items:center;gap:10px;white-space:nowrap;flex:none}
.fchip.sel{background:#12302A;border-color:#2A5A4A;color:var(--mint)}
.fchip b{font:500 12px var(--mono);letter-spacing:.08em;color:var(--amber)}
.chips{display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.bar{display:flex;align-items:center;gap:8px;height:56px;flex:none}
.pager{display:flex;align-items:center;gap:6px;flex:none}
.pager span{font:500 13px var(--mono);letter-spacing:.1em;color:var(--text2);min-width:44px;text-align:center}
.grid{flex:1;min-height:0;display:grid;gap:16px}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--text3);font:500 14px var(--mono);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.vw{height:100%;display:flex;flex-direction:column;gap:16px}

/* scenes */
.sc{height:64px;border-radius:18px;background:transparent;border:1px solid var(--line);color:var(--soft);font:600 16px var(--sans);display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;padding:0 10px}
.sc.on{background:#0E1C18;border-color:#2A5A4A;color:var(--mint)}
.sc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sct{background:var(--raised);border:1px solid var(--line2);border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text);text-align:left;width:100%;height:100%;min-width:0}
.sct.on{background:#0E1C18;border-color:#2A4A3D}
.sct .d{width:48px;height:48px;border-radius:14px;background:#1A2632;color:var(--text2);display:flex;align-items:center;justify-content:center}
.sct.on .d{background:var(--mint);color:#0A2018}
.pin{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cool);background:#13283A;border-radius:12px;height:24px;padding:0 10px;display:inline-flex;align-items:center}

/* switch */
.sw{width:84px;height:48px;border-radius:24px;background:var(--line);position:relative;flex:none;border:0;padding:0}
.sw i{position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:20px;background:var(--text3);transition:left .12s,background-color .12s}
.sw.on{background:var(--amber)}.sw.on i{left:40px;background:#2A1E0A}
.ln{height:64px;display:flex;align-items:center;gap:14px;color:var(--soft);background:none;border:0;padding:0;width:100%;text-align:left;flex:none}
.ln b{font-size:17px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln em{font:500 13px var(--mono);letter-spacing:.08em;font-style:normal;color:var(--text2);white-space:nowrap}
.ln em.heat{color:var(--heat)}.ln em.mint{color:var(--mint)}.ln em.amber{color:var(--amber)}.ln em.crit{color:var(--alert)}

/* light tiles */
.tile{position:relative;overflow:hidden;border-radius:22px;background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text);text-align:left;width:100%;height:100%;transition:border-color .12s;touch-action:none;min-width:0}
.tile.on{border-color:#4E3F22}
.lvl{position:absolute;left:0;right:0;bottom:0;background:#2A2113;transition:height .12s}
.tile .top,.tile .bot{position:relative;display:flex;min-width:0}
.tile .top{justify-content:space-between;align-items:flex-start}
.tile .bot{flex-direction:column;gap:6px}
.d{width:52px;height:52px;border-radius:16px;background:#16212C;color:var(--text2);display:flex;align-items:center;justify-content:center;flex:none}
.tile.on .d{background:var(--amber);color:#2A1E0A}
.tile.na .d{background:transparent;border:1px dashed #3A4856;color:#5E6E7E}
.pct{font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.pct span{font-size:18px;color:#B4A27F;margin-left:2px}
.st{font-size:30px;font-weight:300;line-height:1;color:var(--text3)}
.tile.on .st{color:var(--text)}
.tile.on .s{color:#C9B48C}
.cd{width:14px;height:14px;border-radius:7px;flex:none}

/* climate */
.rt{font-size:36px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.rt span{font-size:15px;color:var(--text2);margin-left:2px}
.rh{font-size:24px;font-weight:300;color:var(--soft);font-variant-numeric:tabular-nums;line-height:1}
.rh span{font-size:13px;color:var(--text3);margin-left:2px}
.blk{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--raised);border:1px solid var(--line)}
.blk.cool{background:#0E1C2A;border-color:#2B4A66}
.blk.heat{background:#241416;border-color:#5E3330}
.blk .btn{background:rgba(7,11,16,.45);border-color:#26333F;font-size:13px;padding:0 8px;min-width:0}
.blk .btn.sel{background:var(--mint);border-color:var(--mint);color:#0A2018}
.blk .btn.dim{color:#5E6E7E;border-color:#1A242E}
.lab{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.lab b{font:600 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spv{width:76px;text-align:center;font-size:30px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;flex:none}

/* curtains */
.win{position:relative;height:120px;border-radius:12px;background:#142231;overflow:hidden;border:1px solid var(--line);touch-action:none;flex:1;min-height:80px}
.win::before{content:"";position:absolute;left:50%;top:10px;bottom:0;width:1px;background:#22344A}
.win .rail{position:absolute;left:0;right:0;top:0;height:6px;background:#2A3744}
.win .fl,.win .fr{position:absolute;top:6px;bottom:0;background:#4A4136;transition:width .12s}
.win .fl{left:0;border-right:3px solid #625645}.win .fr{right:0;border-left:3px solid #625645}
.win.sheer .fl,.win.sheer .fr{background:#3C4A58;border-color:#56677A}
.win.roller .fl{left:0;right:0;width:auto!important;border:0;border-bottom:3px solid #625645}
.win.roller .fr{display:none}
/* INEX 2026-10-27: curtain types, handles, light knob */
.cw{position:relative;border-radius:12px;background:#142231;overflow:hidden;border:1px solid var(--line);touch-action:none;flex:1;min-height:80px;--m:16px;--g:8px}.cw i{position:absolute;display:block;pointer-events:none}.cw.both::before{content:"";position:absolute;left:50%;top:10px;bottom:0;width:1px;background:#22344A}.cw .rl{left:0;right:0;top:0;height:6px;background:#2A3744;z-index:1}.cw .pn{top:6px;bottom:0;background-color:#4A4136;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,transparent 2px 12px)}.cw.net .pn{background-color:#3C4A58}.cw.blackout .pn{background-color:#2A2620}.cw .pn.a{left:0;border-right:3px solid #625645}.cw .pn.b{right:0;border-left:3px solid #625645}.cw.net .pn.a,.cw.net .pn.b{border-color:#56677A}.cw.both .pn{width:calc(var(--m) + (50% - var(--m) - var(--g)) * (1 - var(--p)))}.cw.left .pn,.cw.right .pn{width:calc(var(--m) + (100% - 2 * var(--m)) * (1 - var(--p)))}.cw .hk{top:calc(50% + 3px);width:10px;height:40px;margin:-20px 0 0 -5px;border-radius:6px;background:#E6EDF3;border:2px solid #0F1720;box-sizing:border-box;box-shadow:0 0 0 4px rgba(230,237,243,.12);z-index:2}.cw.both .hk.a{left:calc(var(--m) + (50% - var(--m) - var(--g)) * (1 - var(--p)))}.cw.both .hk.b{left:calc(100% - var(--m) - (50% - var(--m) - var(--g)) * (1 - var(--p)))}.cw.left .hk.a{left:calc(var(--m) + (100% - 2 * var(--m)) * (1 - var(--p)))}.cw.right .hk.b{left:calc(100% - var(--m) - (100% - 2 * var(--m)) * (1 - var(--p)))}.cw.roller .pn,.cw.shutter .pn{left:0;right:0;bottom:auto;height:calc(var(--m) + (100% - 6px - 2 * var(--m)) * (1 - var(--p)));background-image:none;border-bottom:4px solid #625645;box-sizing:border-box}.cw.shutter .pn{background:repeating-linear-gradient(180deg,#5B6875 0 8px,#3F4A55 8px 10px);border-bottom-color:#8A98A6}.cw.roller .hk,.cw.shutter .hk{left:50%;width:40px;height:10px;margin:-5px 0 0 -20px;top:calc(6px + var(--m) + (100% - 6px - 2 * var(--m)) * (1 - var(--p)))}.cw.mv .hk{background:#E2B66E}.tile{--in:14px}.lvl.pv{height:calc(var(--in) + (100% - 2 * var(--in)) * var(--p,0))}.tile:not(.on) .lvl.pv{height:0}.tile .kn{position:absolute;right:18px;bottom:calc(var(--in) + (100% - 2 * var(--in)) * var(--p,0));width:28px;height:6px;margin-bottom:-3px;border-radius:3px;background:#3A4856;box-shadow:0 0 0 3px rgba(7,11,16,.35);pointer-events:none}.tile.on .kn{background:#E6EDF3}.tile:not(.on) .lvl.pv{height:calc(var(--in) + (100% - 2 * var(--in)) * var(--p,0));background:transparent}.lvl.pv::before{content:"";position:absolute;left:12px;right:12px;top:-.5px;height:1px;background:rgba(147,163,179,.35)}.tile.on .lvl.pv::before{background:rgba(243,221,174,.6)}

/* water grid, 3 columns */
.grid.c3 .big{font-size:52px}
.grid.c3 .btn{font-size:12px;letter-spacing:.06em;padding:0 6px;min-width:0}
.grid.c3 .card{padding:18px}

/* cameras */
.cam{border-radius:20px;position:relative;overflow:hidden;background:#141C24;border:1px solid var(--line);color:var(--text);padding:0;width:100%;height:100%;display:block}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camb{position:absolute;left:0;right:0;bottom:0;height:64px;padding:0 18px;display:flex;align-items:center;gap:12px;background:rgba(7,11,16,.82)}
.cam .chip{position:absolute;top:14px;left:14px}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(3,6,9,.84);display:none;align-items:center;justify-content:center}
.scrim.show{display:flex}
#ov{z-index:20}#crit{z-index:35}
.dlg{width:640px;max-width:1000px;background:var(--surface);border:1px solid var(--line2);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:22px}
.dlg.wide{width:1000px;height:640px}
.dlg.critical{background:#241416;border-color:#6A302A}
.keypad{display:grid;grid-template-columns:repeat(3,96px);gap:12px;justify-content:center}
.keypad .btn{height:72px;font-size:24px;font-family:var(--sans)}
.pinv{height:56px;display:flex;align-items:center;justify-content:center;gap:14px}
.pinv i{width:16px;height:16px;border-radius:8px;border:2px solid var(--text2)}
.pinv i.f{background:var(--text)}
#toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);height:52px;padding:0 22px;border-radius:14px;background:#12302A;border:1px solid #2A5A4A;color:var(--mint);font:500 14px var(--mono);letter-spacing:.1em;text-transform:uppercase;display:none;align-items:center;gap:10px;z-index:40}
#toast.show{display:flex}

/* night */
#night{position:absolute;inset:0;background:#000;z-index:30;display:none;color:#8C8478}
#night.show{display:block}
.nb{height:112px;border-radius:20px;background:#0B0A09;border:1px solid #1E1C19;color:#8C8478;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;padding:0 22px;flex:1;text-align:left}
.nb b{font-size:20px;font-weight:500;color:#A39A8C}
.nb span,.ns{font:500 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#6E685E}

#conn{position:absolute;left:216px;right:16px;bottom:16px;height:48px;border-radius:14px;background:#2E2614;border:1px solid #5A4826;color:#E8C487;font:500 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;display:none;align-items:center;justify-content:center;z-index:50;padding:0 16px;text-align:center}
#conn.show{display:flex}

[data-act="sceneedit"]{display:none!important}
.win.blackout .fl,.win.blackout .fr{background:#15191F;border-color:#39424D}
</style>
</head>
<body>
<div id="stage">
  <nav id="side" aria-label="Sections"></nav>
  <header id="top"></header>
  <main id="view"><div class="empty">Connecting…</div></main>
  <div id="ov" class="scrim" role="dialog" aria-modal="true"></div>
  <div id="crit" class="scrim" role="alertdialog" aria-modal="true"></div>
  <div id="toast"></div>
  <div id="night"></div>
  <div id="conn">Connecting to Home Assistant…</div>
</div>

<script>
/* INEX wall panel 10" — single consolidated file (no override blocks).
   BUILD changes on every deploy; open panels compare it every 10 min and reload themselves. */
const BUILD = '1.4.0';
let lastMsg = Date.now(), downSince = 0, noData = 0, reloading = false; const BOOT = Date.now();
const UNAVAILABLE = '<div class="empty">This section is temporarily unavailable</div>';
function safe(fn, fallback = ''){ try { return fn(); } catch (e) { console.error('[panel]', e); return fallback; } }
function hardReload(){ if (reloading) return; reloading = true;
  fetch(location.href, { cache: 'reload' }).then(r => { if (r.ok) location.reload(); else reloading = false; }).catch(() => { reloading = false; }); }
async function checkUpdate(){ try { const t = await (await fetch(location.href, { cache: 'no-store' })).text(); const m = t.match(/const BUILD = '([^']+)'/); if (m && m[1] !== BUILD) hardReload(); } catch (e) {} }

let SCH = [], SCH_T = 0, ED = null;
const DAYS = [['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];
const DPRE = { daily: ['mon','tue','wed','thu','fri','sat','sun'], workday: ['mon','tue','wed','thu','fri'], weekend: ['sat','sun'] };
const schEnts = () => Object.keys(S).filter(id => hasLabel(id, ['schedule']) && !hasLabel(id, SET.hideLabels) && show(id) && ['climate','switch','light','fan','input_boolean','water_heater','cover','valve'].includes(dmn(id)));
async function loadSched(force){
  if (!force && Date.now() - SCH_T < 30000) return; SCH_T = Date.now();
  try { SCH = (await send({ type: 'scheduler' })) || []; schedule(); } catch (e) {}
}
const schTarget = (it) => { for (const ts of it.timeslots || []) for (const a of ts.actions || []) { const e = a.entity_id; if (e) return Array.isArray(e) ? e[0] : e; } return null; };
const schFor = (ids) => SCH.filter(it => ids.includes(schTarget(it)));
const schOn = (it) => S[it.entity_id] && S[it.entity_id].state === 'on';
function dayText(w){ const d = (w || []).flatMap(x => DPRE[x] || [x]); const k = DAYS.map(x => x[0]).filter(x => d.includes(x));
  if (k.length === 7) return 'Every day'; if (k.join() === DPRE.workday.join()) return 'Weekdays'; if (k.join() === DPRE.weekend.join()) return 'Weekend';
  return k.map(x => DAYS.find(y => y[0] === x)[1]).join(' '); }

const edDefTemp = (id) => id && dmn(id) === 'climate' ? (attr(id, 'temperature') || 22) : null;

  const groups = {}; devs.forEach(id => { const r = sxRoomOf(id); const k = r ? r.id : '_'; (groups[k] = groups[k] || { name: r ? r.name : 'Other', ids: [] }).ids.push(id); });
  const order = M.rooms.map(r => r.id).concat(['_']).filter(k => groups[k]);
  const devTab = devs.length ? order.map(k => `<div class="col" style="flex:none;gap:8px"><div class="e">${esc(groups[k].name)}</div><div class="sxroom">${groups[k].ids.map(id => `<button class="sxchip${E.v[id] ? ' sel' : ''}" data-sxpick="${id}">${svg(E.v[id] ? 'x' : 'plus', 'width:18px;height:18px')}${esc(sxName(id))}</button>`).join('')}</div></div>`).join('')
    : `<div class="empty">No devices can be used in scenes yet.<br>The installer marks them with the label “Scene Device”.</div>`;
  const setTab = chosen.length ? chosen.map(sxBlock).join('') : `<div class="empty">Choose devices first</div>`;
  const del = E.id ? (E.confirm ? `<button class="btn danger f" data-sxdelok="1">Delete “${esc(E.name || NM(E.id))}”?</button><button class="btn f" data-sxdelno="1">Keep</button>` : `<button class="btn f" data-sxdel="1" style="color:#F0AFA3">${svg('x')}Delete</button>`) : '';
  openOv(`<div class="dlg wide" style="gap:14px">
    <div class="row" style="gap:10px"><input class="sxin" id="sxname" maxlength="40" placeholder="Scene name" value="${esc(E.name)}" autocomplete="off"><button class="btn sq" data-sxclose="1" aria-label="Close">${svg('x')}</button></div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn f${E.tab === 'devices' ? ' sel' : ''}" data-sxtab="devices">Devices · ${chosen.length}</button><button class="btn f${E.tab === 'settings' ? ' sel' : ''}" data-sxtab="settings" ${chosen.length ? '' : 'disabled'}>Settings</button><button class="btn f${E.tab === 'show' ? ' sel' : ''}" data-sxtab="show">Show on</button>
      <div class="sp"></div>${chosen.length ? `<button class="btn f" data-sxnow="1">${svg('arc')}Take current state</button><button class="btn f" data-sxtry="1">${svg('play')}Try</button>` : ''}</div>
    <div class="sxbody">${E.tab === 'devices' ? devTab : E.tab === 'show' ? sxShowTab() : setTab}</div>
    ${E.err ? `<div class="sxerr">${esc(E.err)}</div>` : ''}
    <div class="row" style="gap:10px;flex-wrap:wrap">${del}<div class="sp"></div><button class="btn f" data-sxclose="1">Cancel</button><button class="btn f sel" data-sxsave="1" ${E.busy ? 'disabled' : ''}>${E.busy ? 'Saving…' : 'Save scene'}</button></div></div>`, 'sceneed');
  const inp = $('sxname'); if (inp) inp.addEventListener('input', () => { E.name = inp.value; });
}
/* where the scene is shown: check boxes = labels Panel <Name> and Home, set by SSV (no HA settings needed) */
function sxShowTab(){
  const E = SX.ed; const names = SX.names || []; const on = (pid) => (E.panels || []).includes(pid);
  const TY = { wall: '10″', tablet: 'Tablet', room: '4″', phone: 'Phone' };
  const box = (attrs, sel, title, sub) => `<button class="sxchip${sel ? ' sel' : ''}" ${attrs} style="justify-content:flex-start;min-width:0;flex:1 1 260px">${svg(sel ? 'check' : 'plus', 'width:18px;height:18px')}<span style="text-align:left">${esc(title)}${sub ? `<br><span style="font:500 11px var(--mono);letter-spacing:.1em;color:var(--text2)">${esc(sub)}</span>` : ''}</span></button>`;
  return `<div class="col" style="flex:none;gap:8px"><div class="e">Home page of the 10″ panels</div><div class="sxroom">${box('data-sxhome="1"', E.home, 'On Home', 'one of the scene buttons on Home')}</div></div>
    <div class="col" style="flex:none;gap:8px"><div class="e">Panels</div><div class="sxroom">${names.length ? names.map(n => box(`data-sxpanel="${esc(n.id)}"`, on(n.id), n.name, TY[n.type] || n.type)).join('') : `<div class="empty">${SX.names ? 'No panels on the SSV Dashboard page yet' : 'Loading the panels…'}</div>`}</div>
    <div class="s" style="font-size:13px">${(E.panels || []).length ? 'Shown only on the panels chosen here' : 'No panel chosen: the scene is shown on every panel'}</div></div>`;
}
const sxB = (id, k, val, label, cur) => `<button class="btn${String(cur) === String(val) ? ' sel' : ''}" data-sxset="${id}" data-k="${k}" data-val="${esc(val)}">${esc(label)}</button>`;
const sxStep = (id, k, d, txt) => `<button class="btn sq" data-sxstep="${id}" data-k="${k}" data-d="-1" aria-label="Lower">${svg('minus')}</button><div class="sxval">${txt}</div><button class="btn sq" data-sxstep="${id}" data-k="${k}" data-d="1" aria-label="Raise">${svg('plus')}</button>`;
function sxBlock(id){
  const v = SX.ed.v[id], a = (S[id] || {}).attributes || {}, d = dmn(id); const r = sxRoomOf(id); const rows = [];
  if (d === 'climate') {
    rows.push(`<div class="sxrow"><span class="lbl">Mode</span>${sxModes(id).map(m => sxB(id, 'state', m, MODE[m] || m, v.state)).join('')}</div>`);
    if (v.state !== 'off') {
      if (a.min_temp != null || a.temperature != null) rows.push(`<div class="sxrow"><span class="lbl">Set point</span>${sxStep(id, 'temperature', 1, (v.temperature != null ? fmtT(v.temperature) : '--') + '°')}</div>`);
      [['fan_mode','fan_modes','Fan'],['swing_mode','swing_modes','Swing'],['preset_mode','preset_modes','Preset']].forEach(([k, opts, lbl]) => { const o = a[opts] || []; if (o.length) rows.push(`<div class="sxrow"><span class="lbl">${lbl}</span>${o.map(m => sxB(id, k, m, m, v[k])).join('')}</div>`); });
    }
  } else if (d === 'cover') {
    const pos = (attr(id, 'supported_features') || 0) & 4;
    if (pos) rows.push(`<div class="sxrow"><span class="lbl">Position</span>${sxB(id, 'current_position', 100, 'Open', v.current_position)}${sxB(id, 'current_position', 0, 'Closed', v.current_position)}${sxStep(id, 'current_position', 10, (v.current_position != null ? v.current_position : '--') + ' %')}</div>`);
    else rows.push(`<div class="sxrow"><span class="lbl">State</span>${sxB(id, 'state', 'open', 'Open', v.state)}${sxB(id, 'state', 'closed', 'Closed', v.state)}</div>`);
  } else {
    rows.push(`<div class="sxrow"><span class="lbl">Power</span>${sxB(id, 'state', 'on', 'On', v.state)}${sxB(id, 'state', 'off', 'Off', v.state)}</div>`);
    if (d === 'light' && v.state === 'on') {
      const modes = a.supported_color_modes || [];
      if (modes.some(m => m !== 'onoff')) rows.push(`<div class="sxrow"><span class="lbl">Brightness</span>${sxStep(id, 'brightness', 1, (v.brightness != null ? Math.max(1, Math.round(v.brightness / 2.55)) : 100) + ' %')}</div>`);
      if (modes.includes('color_temp')) { const lo = a.min_color_temp_kelvin || 2700, hi = a.max_color_temp_kelvin || 6500; const k3 = [[2700,'Warm'],[4000,'Neutral'],[5500,'Daylight']].map(([k, n]) => [Math.min(hi, Math.max(lo, k)), n]);
        rows.push(`<div class="sxrow"><span class="lbl">Colour</span>${k3.map(([k, n]) => sxB(id, 'color_temp_kelvin', k, n, v.color_temp_kelvin)).join('')}</div>`); }
    }
  }
  if (d === 'fan' && v.state === 'on' && (attr(id, 'supported_features') || 0) & 1) rows.push(`<div class="sxrow"><span class="lbl">Speed</span>${sxStep(id, 'percentage', 1, (v.percentage != null ? v.percentage : attr(id, 'percentage') ?? 100) + ' %')}</div>`);
  const t = SX.ed.t[id] || {};
  rows.push(`<div class="sxrow"><span class="lbl">Start</span>${sxStep(id, 'delay', 1, fmtDelay(t.delay || 0))}<span class="lbl" style="margin-left:12px">Go back</span>${sxStep(id, 'back', 1, fmtBack(t.back || 0))}</div>`);
  if (t.back) rows.push(`<div class="sxrow"><span class="lbl">Back to</span><button class="btn${(t.back_to || 'previous') === 'previous' ? ' sel' : ''}" data-sxt="${id}" data-val="previous">As before</button><button class="btn${t.back_to === 'off' ? ' sel' : ''}" data-sxt="${id}" data-val="off">${d === 'cover' ? 'Closed' : 'Off'}</button></div>`);
  return `<div class="sxblk"><div class="row" style="gap:12px">${svg(d === 'climate' ? 'snow' : d === 'cover' ? 'curtains' : 'bulb', 'color:var(--text2)')}<div class="col"><div class="n" style="font-size:18px">${esc(sxName(id))}</div><div class="s">${esc(r ? r.name : '')}</div></div><button class="btn sq" data-sxpick="${id}" aria-label="Remove">${svg('x')}</button></div>${rows.join('')}</div>`;
}
function sxStepVal(id, k, dir){
  const v = SX.ed.v[id], a = (S[id] || {}).attributes || {};
  if (k === 'temperature') { const st = a.target_temp_step || 0.5; v.temperature = Math.min(a.max_temp ?? 30, Math.max(a.min_temp ?? 7, Math.round(((v.temperature ?? a.temperature ?? 22) + dir * st) * 10) / 10)); }
  else if (k === 'brightness') { const p = Math.max(1, Math.round((v.brightness ?? 255) / 2.55)); const np = Math.min(100, Math.max(10, (p < 10 && dir > 0 ? 10 : Math.round(p / 10) * 10 + dir * 10))); v.brightness = Math.round(np * 2.55); }
  else if (k === 'delay' || k === 'back') { const L = k === 'delay' ? SX_DELAY : SX_BACK; const t = SX.ed.t[id] = SX.ed.t[id] || {}; const i = Math.max(0, L.indexOf(t[k] || 0)); t[k] = L[Math.min(L.length - 1, Math.max(0, i + dir))]; }
  else if (k === 'percentage') { v.percentage = Math.min(100, Math.max(10, Math.round(((v.percentage ?? attr(id, 'percentage') ?? 100) + dir * 10) / 10) * 10)); }
  else if (k === 'current_position') { v.current_position = Math.min(100, Math.max(0, Math.round(((v.current_position ?? 50) + dir * 10) / 10) * 10)); }
}
function sxPayload(){ const out = {}; Object.keys(SX.ed.v).forEach(id => { const v = Object.assign({}, SX.ed.v[id]); if (dmn(id) === 'light' && v.state !== 'on') { delete v.brightness; delete v.color_temp_kelvin; } if (dmn(id) === 'fan' && v.state !== 'on') delete v.percentage; if (dmn(id) === 'climate' && v.state === 'off') { ['temperature','fan_mode','swing_mode','preset_mode'].forEach(k => delete v[k]); } out[id] = v; }); return out; }
async function sxSave(){
  const E = SX.ed; const inp = $('sxname'); if (inp) E.name = inp.value;
  E.name = (E.name || '').trim();
  if (!E.name) { E.err = 'Give the scene a name'; sxPaint(); return; }
  if (!Object.keys(E.v).length) { E.err = 'Choose at least one device'; sxPaint(); return; }
  E.busy = true; E.err = ''; sxPaint();
  const timing = {}; Object.keys(E.v).forEach(id => { const t = E.t[id]; if (t && (t.delay || t.back)) timing[id] = { delay: t.delay || 0, back: t.back || 0, back_to: t.back_to || 'previous' }; });
  try { const data = { name: E.name, entities: sxPayload(), timing, home: !!E.home }; if (E.panels != null) data.panels = E.panels; if (E.id) data.scene = E.id;
    await sxCall('save', data); SX.ed = null; closeOv(); toast(`Scene “${data.name}” saved`); setTimeout(() => { if (!ovKind) { SX.manage = false; openScenes(); } }, 1500); }
  catch (e) { E.busy = false; E.err = sxErr(e); sxPaint(); }
}
async function sxDelete(){
  const E = SX.ed; E.busy = true; sxPaint();
  try { await sxCall('delete', { scene: E.id }); const n = E.name; SX.ed = null; closeOv(); toast(`Scene “${n}” deleted`); setTimeout(() => { if (!ovKind) openScenes(); }, 1500); }
  catch (e) { E.busy = false; E.confirm = false; E.err = sxErr(e); sxPaint(); }
}
async function sxEdit(id){
  try { const r = await sxCall('get', { scene: id }); const v = {}; Object.keys(r.entities || {}).forEach(eid => { if (S[eid]) v[eid] = Object.assign({}, r.entities[eid]); });
    const t = {}; Object.keys(r.timing || {}).forEach(eid => { if (v[eid]) t[eid] = Object.assign({}, r.timing[eid]); });
    sxOpen({ id, name: r.name || NM(id), v, t, panels: r.panels || [], home: !!r.home, tab: 'settings' }); }
  catch (e) { toast('Cannot open this scene'); }
}
stage.addEventListener('click', (e) => {
  const el = e.target.closest('button'); if (!el) return; const d = el.dataset;
  if (d.sxmanage) { SX.manage = !SX.manage; openScenes(); return; }
  if (d.sxnew) { SX.manage = false; sxOpen({ id: null, name: '', v: {} }); return; }
  if (d.sxedit) { sxEdit(d.sxedit); return; }
  if (!SX.ed) return;
  const E = SX.ed; const inp = $('sxname'); if (inp) E.name = inp.value;
  if (d.sxclose) { SX.ed = null; closeOv(); openScenes(); return; }
  if (d.sxtab) { E.tab = d.sxtab; sxPaint(); return; }
  if (d.sxpick) { if (E.v[d.sxpick]) { delete E.v[d.sxpick]; delete E.t[d.sxpick]; } else E.v[d.sxpick] = sxCurrent(d.sxpick); sxPaint(); return; }
  if (d.sxset) { const v = E.v[d.sxset]; let val = d.val; if (['current_position','color_temp_kelvin'].includes(d.k)) val = +val; v[d.k] = val;
    if (d.k === 'state' && dmn(d.sxset) === 'climate' && val !== 'off' && v.temperature == null) v.temperature = attr(d.sxset, 'temperature') ?? 22;
    if (d.k === 'state' && dmn(d.sxset) === 'fan' && val === 'on' && v.percentage == null && attr(d.sxset, 'percentage') != null) v.percentage = attr(d.sxset, 'percentage');
    if (d.k === 'state' && dmn(d.sxset) === 'light' && val === 'on' && v.brightness == null && (attr(d.sxset, 'supported_color_modes') || []).some(m => m !== 'onoff')) v.brightness = 255;
    sxPaint(); return; }
  if (d.sxstep) { sxStepVal(d.sxstep, d.k, +d.d); sxPaint(); return; }
  if (d.sxt) { (E.t[d.sxt] = E.t[d.sxt] || {}).back_to = d.val; sxPaint(); return; }
  if (d.sxhome) { E.home = !E.home; sxPaint(); return; }
  if (d.sxpanel) { const L = E.panels || []; E.panels = L.includes(d.sxpanel) ? L.filter(x => x !== d.sxpanel) : [...L, d.sxpanel]; sxPaint(); return; }
  if (d.sxnow) { Object.keys(E.v).forEach(id => E.v[id] = sxCurrent(id)); sxPaint(); return; }
  if (d.sxtry) { call('scene', 'apply', { entities: sxPayload() }); toast('Trying the scene'); return; }
  if (d.sxsave) { sxSave(); return; }
  if (d.sxdel) { E.confirm = true; sxPaint(); return; }
  if (d.sxdelno) { E.confirm = false; sxPaint(); return; }
  if (d.sxdelok) { sxDelete(); return; }
});
function closeOv(){ ovKind = null; SX.ed = null; $('ov').classList.remove('show'); $('ov').innerHTML = ''; }
document.addEventListener('keydown', () => touched());

</script>
